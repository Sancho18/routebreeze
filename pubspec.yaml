name: routebreeze
description: >-
  RouteBreeze: roteirização de entregas com bloqueio biométrico, autocomplete
  de endereços, rota otimizada e recálculo dinâmico. Desenvolvido como projeto
  da etapa técnica de um processo seletivo para desenvolvedor(a) Flutter.
publish_to: 'none'
version: 0.2.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  dio: ^5.11.1
  google_maps_flutter: ^2.18.1
  local_auth: ^3.0.2
  geolocator: ^14.0.3
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  equatable: ^3.0.0
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  google_maps_flutter_platform_interface: ^2.17.0
  url_launcher_platform_interface: ^2.3.2
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
